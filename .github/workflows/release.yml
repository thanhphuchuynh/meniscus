name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: node -e 'if ("v" + require("./packages/meniscus/package.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" release-notes.md
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: packages/meniscus
      - run: npm publish --access public
        working-directory: packages/meniscus
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "meniscus-${GITHUB_REF_NAME#v}.tgz" --verify-tag --title "meniscus $GITHUB_REF_NAME" --notes-file release-notes.md
